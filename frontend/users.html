<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users Page</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/users.html">Users</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Main -->
    <div>
      <!-- Model trigger button -->
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#user-modal"
      >
        Add User
      </button>
      <!-- Modal -->
      <div
        class="modal fade"
        id="user-modal"
        tabindex="-1"
        aria-labelledby="user-modalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="user-modalLabel">Add User</h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <form action="#" id="user-form" class="needs-validation" novalidate>
              <div class="modal-body">
                <!-- First Name  -->
                <div class="input-group mb-3">
                  <span class="input-group-text" id="basic-addon1"
                    >First Name</span
                  >
                  <input
                    type="text"
                    name="firstName"
                    id="first-name-input"
                    class="form-control"
                    placeholder="FirstName"
                    aria-label="FirstName"
                    aria-describedby="basic-addon1"
                    required
                  />
                  <div class="invalid-feedback">
                    Please Provide a First Name
                  </div>
                  <div class="valid-feedback">Looks good!</div>
                </div>
                <!-- Last Name -->
                <div class="input-group mb-3">
                  <span class="input-group-text" id="basic-addon1"
                    >Last Name</span
                  >
                  <input
                    type="text"
                    name="lastName"
                    id="last-name-input"
                    class="form-control"
                    placeholder="LastName"
                    aria-label="LastName"
                    aria-describedby="basic-addon1"
                    required
                  />
                  <div class="invalid-feedback">Please Provide a Last Name</div>
                  <div class="valid-feedback">Looks good!</div>
                </div>
                <!-- Age -->
                <div class="input-group mb-3">
                  <span class="input-group-text" id="basic-addon1">Age</span>
                  <input
                    name="age"
                    type="number"
                    id="age-input"
                    min="18"
                    max="65"
                    class="form-control"
                    placeholder="Age"
                    aria-label="Age"
                    aria-describedby="basic-addon1"
                    required
                  />
                  <div class="invalid-feedback">
                    Age Must Be At Least 18, and a Max of 65
                  </div>
                  <div class="valid-feedback">Looks good!</div>
                </div>
              </div>

              <div class="modal-footer">
                <!-- Buttons -->
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <input
                  type="submit"
                  class="btn btn-primary"
                  value="Save Changes"
                />
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div id="table"></div>
    <!-- Footer -->
    <div class="container"></div>
    <!-- Bootstrap JS -->
    <script src="/node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <!-- Custom JS -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
